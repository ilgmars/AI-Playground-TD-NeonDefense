name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          # Headless Chrome on Actions can flake without these.
          CI: 'true'

      - name: Upload screenshot artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: /tmp/shots/**
          if-no-files-found: ignore
          retention-days: 7
