name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# actions/* versions pinned here all target Node 24 natively, so no
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 escape hatch is needed. The Node
# version used by `npm test` itself is bumped to 22 LTS (Node 20 LTS
# ended Apr 2026; 22 is the current active LTS).
#   - actions/checkout@v6 (was v4)
#   - actions/setup-node@v6 (was v4)
#   - actions/upload-artifact@v7 (was v4)

jobs:
  test:
    name: Run test suite (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Suite is sharded 3 ways (round-robin via `npm test -- --shard=N/3`), so
    # each job runs ~1/3 of the suites in parallel. fail-fast: false so one
    # shard's failure doesn't cancel the others (full signal in one run).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Bin-packed shards run ~3-4m of tests; 20m absorbs slow-runner setup
    # (npm ci + playwright install --with-deps can balloon on a cold runner).
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium

      # turn-config.js is gitignored — the install script materialises it.
      # Without a secret the bundle is empty (STUN-only), which is fine
      # for tests; the script tag in index.html just needs to NOT 404.
      - name: Install TURN config (empty bundle if no secret)
        env:
          NEON_TURN_CONFIG: ${{ secrets.NEON_TURN_CONFIG }}
        run: ./tools/install-turn-config.sh

      - name: Run tests
        run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          # Headless Chrome on Actions can flake without these.
          CI: 'true'

      - name: Upload screenshot artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: /tmp/shots/**
          if-no-files-found: ignore
          retention-days: 7

  # Separate job for the long-running autopilot smoke test (~3 min).
  # Runs in parallel with the fast suite so total wall-clock stays
  # bounded. Failure here does NOT block APK/Pages — only the `test`
  # job above is the gate (build-apk.yml uses needs: test). The smoke
  # is intended to catch slow autopilot regressions that the fast
  # suites can't see.
  smoke:
    name: Autopilot smoke
    runs-on: ubuntu-latest
    # The smoke loop self-caps at MAX_WAIT_MS=5m; 20m absorbs slow-runner setup
    # (it hit the old 15m on setup variance, not a hang).
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium

      - name: Install TURN config (empty bundle if no secret)
        env:
          NEON_TURN_CONFIG: ${{ secrets.NEON_TURN_CONFIG }}
        run: ./tools/install-turn-config.sh

      - name: Run autopilot smoke
        run: node tests/autopilot.smoke.js --snapshots=10,30 --speed=2048 --ascension=3
        env:
          CI: 'true'
