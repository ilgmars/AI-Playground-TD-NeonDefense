name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Opt into the Node 24 runtime for actions/* steps (silences the
# deprecation warning emitted when actions still target Node 20).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          # Headless Chrome on Actions can flake without these.
          CI: 'true'

      - name: Upload screenshot artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: /tmp/shots/**
          if-no-files-found: ignore
          retention-days: 7

  # Separate job for the long-running autopilot smoke test (~3 min).
  # Runs in parallel with the fast suite so total wall-clock stays
  # bounded. Failure here does NOT block APK/Pages — only the `test`
  # job above is the gate (build-apk.yml uses needs: test). The smoke
  # is intended to catch slow autopilot regressions that the fast
  # suites can't see.
  smoke:
    name: Autopilot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run autopilot smoke
        run: node tests/autopilot.smoke.js --snapshots=10,30 --speed=2048 --ascension=3
        env:
          CI: 'true'
