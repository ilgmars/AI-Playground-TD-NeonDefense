name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# actions/* versions pinned here all target Node 24 natively, so no
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 escape hatch is needed. The Node
# version used by `npm test` itself is bumped to 22 LTS (Node 20 LTS
# ended Apr 2026; 22 is the current active LTS).
#   - actions/checkout@v6 (was v4)
#   - actions/setup-node@v6 (was v4)
#   - actions/upload-artifact@v7 (was v4)

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          # Headless Chrome on Actions can flake without these.
          CI: 'true'

      - name: Upload screenshot artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: /tmp/shots/**
          if-no-files-found: ignore
          retention-days: 7

  # Separate job for the long-running autopilot smoke test (~3 min).
  # Runs in parallel with the fast suite so total wall-clock stays
  # bounded. Failure here does NOT block APK/Pages — only the `test`
  # job above is the gate (build-apk.yml uses needs: test). The smoke
  # is intended to catch slow autopilot regressions that the fast
  # suites can't see.
  smoke:
    name: Autopilot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run autopilot smoke
        run: node tests/autopilot.smoke.js --snapshots=10,30 --speed=2048 --ascension=3
        env:
          CI: 'true'
