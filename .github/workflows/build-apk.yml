name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'index.html'
      - 'style.css'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to upload release assets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser (chromium) + OS deps
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
        env:
          CI: 'true'

  build:
    needs: test           # APK only builds if the test suite passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync web assets into Android project
        run: |
          rm -rf android/app/src/main/assets/www/src
          cp -R src android/app/src/main/assets/www/src
          cp index.html android/app/src/main/assets/www/index.html
          cp style.css  android/app/src/main/assets/www/style.css

      - name: Set local.properties (point to CI SDK)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/neon-release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NeonDefense.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDefense-apk
          path: NeonDefense.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        run: gh release upload Games NeonDefense.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
