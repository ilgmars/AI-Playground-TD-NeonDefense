name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'index.html'
      - 'style.css'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed to upload release assets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync web assets into Android project
        run: |
          rm -rf android/app/src/main/assets/www/src
          cp -R src android/app/src/main/assets/www/src
          cp index.html android/app/src/main/assets/www/index.html
          cp style.css  android/app/src/main/assets/www/style.css

      - name: Set local.properties (point to CI SDK)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NeonDefense.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDefense-apk
          path: NeonDefense.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        run: |
          gh release upload Games NeonDefense.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
