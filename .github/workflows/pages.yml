name: Deploy Pages

# Combined deploy: main → /, multiplayer → /multiplayer/. The two
# branches share a single Pages environment, so whichever branch is
# pushed must rebuild the combined artifact from both refs (each at
# its current HEAD). That way:
#   https://ilgmars.github.io/AI-Playground-TD-NeonDefense/             → main
#   https://ilgmars.github.io/AI-Playground-TD-NeonDefense/multiplayer/ → mp
#
# Tests run on the branch that triggered the workflow (the ref the
# push landed on). If they fail, no deploy happens and the previous
# Pages build stays live for both paths.
#
# Setup note: this workflow requires the repository's Pages source to
# be switched to "GitHub Actions" in Settings → Pages.

on:
  push:
    branches: [main, multiplayer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel an in-flight deploy if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'

  deploy:
    name: Deploy combined site (main + /multiplayer/)
    needs: test       # only if the test gate is green
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main → site/
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Check out multiplayer → site/multiplayer/
        uses: actions/checkout@v4
        with:
          ref: multiplayer
          path: site/multiplayer
      - name: Strip nested .git / CI metadata from the artifact
        run: |
          rm -rf site/.git site/.github site/multiplayer/.git site/multiplayer/.github
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
