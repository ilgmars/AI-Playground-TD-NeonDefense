name: Deploy Pages

# Gates the GitHub Pages deploy on the full test suite. Tests run first;
# if any suite fails, the deploy job is skipped (badge goes red, the
# previous Pages build stays live).
#
# Setup note: this workflow requires the repository's Pages source to
# be switched to "GitHub Actions" in Settings → Pages. While the source
# is still "Deploy from a branch", every push to main auto-deploys and
# bypasses this gate.
#
# History note: an earlier revision of this file checked out a separate
# `multiplayer` branch into a /multiplayer/ subdirectory. The multiplayer
# work has since been merged into main and the branch deleted, so this
# is back to the simple main-only deploy. The /multiplayer/ subpath
# stays live on the last combined artifact until the next deploy
# overwrites it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Cancel an in-flight deploy if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'

  deploy:
    name: Deploy to Pages
    needs: test       # only if the test gate is green
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root — index.html + src/ + style.css. Excludes
          # are handled by the action's defaults (no .git, etc).
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
