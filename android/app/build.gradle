plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neondefense.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.neondefense.game"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            // CI decodes KEYSTORE_BASE64 secret into android/app/neon-release.keystore.
            // For local builds, place neon-release.keystore in this directory.
            storeFile     file("neon-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "neondefense2024"
            keyAlias      System.getenv("KEY_ALIAS")         ?: "neon-release"
            keyPassword   System.getenv("KEY_PASSWORD")      ?: "neondefense2024"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
